name: Deploy to S3

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  id-token: write # OIDC token to assume the AWS role, no stored keys
  contents: read

env:
  AWS_ROLE_ARN: arn:aws:iam::677123926390:role/GitHubAction
  AWS_REGION: us-east-1
  S3_BUCKET: losteonsweb

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26

      - run: npm ci
      - run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # Assets first, HTML last, so a page never points at a file that isn't uploaded yet.
      - name: Upload assets (cached for a day)
        run: |
          aws s3 sync dist/ "s3://$S3_BUCKET" \
            --exclude "*.html" \
            --cache-control "public, max-age=86400"

      - name: Upload HTML (revalidated on every visit)
        run: |
          aws s3 sync dist/ "s3://$S3_BUCKET" \
            --exclude "*" --include "*.html" \
            --cache-control "no-cache"

      - name: Remove files no longer in the build
        run: |
          aws s3 sync dist/ "s3://$S3_BUCKET" --delete --size-only
