apiVersion: apps/v1
kind: Deployment
metadata:
  name: losteons-web
  labels:
    app: losteons-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: losteons-web
  template:
    metadata:
      labels:
        app: losteons-web
    spec:
      containers:
        - name: web
          image: ghcr.io/your-org/losteons-web:latest
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /
              port: 80
          livenessProbe:
            httpGet:
              path: /
              port: 80
---
apiVersion: v1
kind: Service
metadata:
  name: losteons-web
spec:
  selector:
    app: losteons-web
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: losteons-web
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - losteons.example.com
      secretName: losteons-web-tls
  rules:
    - host: losteons.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: losteons-web
                port:
                  number: 80
